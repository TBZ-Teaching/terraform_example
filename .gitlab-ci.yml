stages:
  - build
  - apply
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "us-east-1"
  TF_STATE_BUCKET: "DEIN-S3-BUCKET-NAME"
  # S3 Key (ohne führenden Slash), z.B. state/main/terraform.tfstate
  TF_STATE_KEY: "state/${CI_COMMIT_REF_SLUG}/terraform.tfstate"

terraform-plan:
  stage: build
  image: hashicorp/terraform:1.8.5
  script:
    - cd terraform
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 day
  only:
    - branches
    - merge_requests

docker-build-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build -f cicd/docker/Dockerfile -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" cicd/docker
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker tag "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main

terraform-apply:
  stage: apply
  image: hashicorp/terraform:1.8.5
  script:
    - cd terraform
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}"
    - terraform apply -auto-approve ./tfplan
  needs:
    - job: terraform-plan
      artifacts: true
  when: manual
  only:
    - main

terraform-destroy:
  stage: destroy
  image: hashicorp/terraform:1.8.5
  script:
    - cd terraform
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}"
    - terraform destroy -auto-approve
  when: manual
  only:
    - main
